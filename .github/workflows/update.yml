name: Update tariff tracker

on:
  schedule:
    - cron: "17 10 * * *"   # morning
    - cron: "17 18 * * *"   # evening, catches readings Octopus publishes late
  workflow_dispatch:
  push:
    paths:
      - "heatpump/**"   # re-run when new econet24 exports are uploaded

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch usage and rates
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_ACCOUNT: ${{ secrets.OCTOPUS_ACCOUNT }}
          START_DATE: ${{ vars.START_DATE }}
          FLAT_RATE: ${{ vars.FLAT_RATE }}
          HISTORY_START: ${{ vars.HISTORY_START || '2026-09-10' }}
        run: python scripts/update.py
      - name: Process heat pump exports
        env:
          HISTORY_START: ${{ vars.HISTORY_START || '2026-09-10' }}
        run: python scripts/heatpump.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/heatpump.json
          git diff --cached --quiet || git commit -m "Update tracker data"
          git push
