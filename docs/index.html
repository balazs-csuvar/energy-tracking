<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosy tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#141413;--sub:#5c5b56;--muted:#8a8882;--line:#e4e2da;--pos:#2a78d6;--neg:#e34948;--pos-bg:#e8f1fc;--neg-bg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1d1d1b;--ink:#f0efec;--sub:#c3c2b7;--muted:#8a8882;--line:#2e2e2b;--pos:#3987e5;--neg:#e66767;--pos-bg:#16263a;--neg-bg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;font-weight:500;margin:0}
.sub{color:var(--sub);font-size:14px;margin:4px 0 20px}
.verdict{border-radius:12px;padding:16px 18px;margin-bottom:16px;font-size:15px}
.verdict b{font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile p{margin:0}.tile .l{font-size:13px;color:var(--sub)}.tile .v{font-size:24px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:500;margin:0 0 10px}
.chart{position:relative;height:260px}
.ctl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
.ctl input{width:90px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Cosy vs flat rate</h1>
<p class="sub" id="meta">Loading…</p>

<div class="card ctl">
  <label for="flat">Compare against flat rate</label>
  <input id="flat" type="number" step="0.01" min="0" inputmode="decimal"> p/kWh
</div>

<div class="verdict" id="verdict"></div>

<div class="grid">
  <div class="tile"><p class="l">Saved so far</p><p class="v" id="k-saved">–</p></div>
  <div class="tile"><p class="l">Saving</p><p class="v" id="k-pct">–</p></div>
  <div class="tile"><p class="l">Days Cosy won</p><p class="v" id="k-days">–</p></div>
  <div class="tile"><p class="l">Your avg rate</p><p class="v" id="k-avg">–</p></div>
</div>

<div class="card">
  <h2>Running total</h2>
  <div class="chart"><canvas id="cum" role="img" aria-label="Cumulative saving of Cosy versus the flat rate over time"></canvas></div>
</div>

<div class="card">
  <h2>Daily saving</h2>
  <div class="chart"><canvas id="daily" role="img" aria-label="Daily saving of Cosy versus the flat rate; bars above zero mean Cosy was cheaper"></canvas></div>
</div>

<p class="note">Unit costs only, standing charges excluded. Usage arrives from Octopus about a day late; the page refreshes once a day.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const gbp = p => (p < 0 ? '-' : '') + '£' + (Math.abs(p) / 100).toFixed(2);
let data, cumChart, dailyChart;

function store(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) { v = null; } return v; }

function render() {
  const flat = parseFloat($('flat').value);
  if (!(flat > 0)) return;
  const days = data.days;
  const labels = days.map(d => new Date(d.date + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }));
  const save = days.map(d => d.kwh * flat - d.cost_p);
  let run = 0; const cum = save.map(s => (run += s) / 100);
  const kwh = days.reduce((a, d) => a + d.kwh, 0), cost = days.reduce((a, d) => a + d.cost_p, 0), flatCost = kwh * flat;
  const won = save.filter(s => s > 0).length;

  $('k-saved').textContent = gbp(flatCost - cost);
  $('k-pct').textContent = ((flatCost - cost) / flatCost * 100).toFixed(1) + '%';
  $('k-days').textContent = won + ' of ' + days.length;
  $('k-avg').textContent = (cost / kwh).toFixed(1) + 'p';

  const ahead = flatCost >= cost, v = $('verdict');
  v.style.background = css(ahead ? '--pos-bg' : '--neg-bg');
  v.innerHTML = ahead
    ? `<b>Cosy is ahead.</b> ${gbp(flatCost - cost)} cheaper than ${flat}p over ${days.length} days, about ${gbp((flatCost - cost) / days.length)} a day.`
    : `<b>Flat ${flat}p would be cheaper.</b> Cosy has cost ${gbp(cost - flatCost)} more over ${days.length} days.`;

  if (!window.Chart) return;
  const muted = css('--muted'), line = css('--line'), pos = css('--pos'), neg = css('--neg');
  const base = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false }, ticks: { color: muted, maxRotation: 0, autoSkipPadding: 12 } },
              y: { grid: { color: c => c.tick.value === 0 ? muted : line }, ticks: { color: muted } } } };

  cumChart?.destroy(); dailyChart?.destroy();
  cumChart = new Chart($('cum'), { type: 'line',
    data: { labels, datasets: [{ data: cum, borderColor: pos, backgroundColor: pos + '1a', fill: 'origin', borderWidth: 2, pointRadius: 0, tension: 0.25 }] },
    options: { ...base, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => 'Total ' + gbp(c.raw * 100) } } },
      scales: { ...base.scales, y: { ...base.scales.y, ticks: { color: muted, callback: x => '£' + x } } } } });
  dailyChart = new Chart($('daily'), { type: 'bar',
    data: { labels, datasets: [{ data: save.map(s => Math.round(s)), backgroundColor: save.map(s => s >= 0 ? pos : neg), borderRadius: 4, borderSkipped: false, maxBarThickness: 16 }] },
    options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: {
      label: c => (c.raw > 0 ? 'Saved ' : c.raw < 0 ? 'Lost ' : 'Even ') + Math.abs(c.raw) + 'p · ' + days[c.dataIndex].kwh.toFixed(1) + ' kWh' } } },
      scales: { ...base.scales, y: { ...base.scales.y, ticks: { color: muted, callback: x => x + 'p' } } } } });
}

fetch('data.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null).then(d => {
  if (!d || !d.days?.length) { $('meta').textContent = 'No data yet — run the "Update tariff tracker" workflow.'; return; }
  data = d;
  $('flat').value = store('flatRate') || d.flat_rate;
  const upd = new Date(d.updated).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
  $('meta').textContent = `${d.tariff} · ${d.days[0].date} to ${d.days.at(-1).date} · updated ${upd}`;
  render();
  $('flat').addEventListener('input', () => { store('flatRate', $('flat').value); render(); });
});
</script>
</body>
</html>
